spring:
  application:
    name: msclient

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://ms-eureka-user:ms-eureka-user-password@eurekaservercont:8761/eurekaserver

  instance:
    hostname: localhost
    instanceId: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  file:
    name: ./log/log-file.log