spring:
  application:
    name: mscard
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://ms-eureka-user:ms-eureka-user-password@localhost:8761/eureka

  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

mq:
  queues:
    mscard_card_issuance: mscard_card_issuance

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  file:
    name: ./log/log-file.log