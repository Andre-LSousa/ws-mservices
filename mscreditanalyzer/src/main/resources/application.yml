spring:
  application:
    name: mscreditanalyzer
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://ms-eureka-user:ms-eureka-user-password@eurekaservercont:8761/eurekaserver

  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

mq:
  queues:
    mscard_card_issuance: mscard_card_issuance

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  file:
    name: ./log/log-file.log